id: gateway-dossier
type: summary
topic: Gateway — x402/ERC-8004 Free Trial Access Gateway
status: active
summary: >
  Canonical operator-reviewed dossier for the gateway project: a proposed access
  gateway that gates free trial API and SaaS access via two paths — pay a penny
  (x402 micropayment) or present a ZK reputation credential via ERC-8004 Trustless
  Agents. No code has been shipped as of the reviewed date; the project is in the
  spark/ideation stage.
tags:
  - gateway
  - x402
  - erc-8004
  - zk
  - free-trial
  - dossier
dossier:
  project_key: gateway
  last_reviewed: '2026-07-11'
  reviewer:
    id: reviewer
    display_name: Example Reviewer
  evidence:
