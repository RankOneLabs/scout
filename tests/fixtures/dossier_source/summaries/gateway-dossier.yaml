      kind: git-blob
      locator: >-
        example-org/content-source @ b6db208:
        entries/2026-02-18-x402-8004-free-trial-gateway.yaml
      immutable_ref: 843b9b5b4f757c2f41d9d7d0747ba4b459e8321d
    - id: evidence-erc8004-opp-entry-blob
      kind: git-blob
      locator: >-
