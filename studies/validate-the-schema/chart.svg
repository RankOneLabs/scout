  .ax { font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #52514e; }
  .bg { fill: #ffffff; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
  .base { stroke: #b5b4ae; stroke-width: 1; }
  .planned { fill: #2a78d6; }
  .retired { fill: #b5b4ae; }
  .mark { stroke: #0b0b0b; stroke-width: 2; }
  .markl { font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0b0b0b; }
  @media (prefers-color-scheme: dark) {
    .t, .g, .l, .v, .markl { fill: #ffffff; }
    .s, .tag, .ax { fill: #c3c2b7; }
    .bg { fill: #0d1117; }
    .grid { stroke: #383835; }
    .base { stroke: #6b6a66; }
    .planned { fill: #3987e5; }
    .retired { fill: #6b6a66; }
    .mark { stroke: #ffffff; }
  }
</style>
